[project]
name = "wehoop-wnba-stats-data-build"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sportsdataverse @ git+https://github.com/sportsdataverse/sportsdataverse-py@main",
    "polars>=1.0",
    "pyarrow>=15.0",
    "curl-cffi>=0.15.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["wnba_data_build*", "wnba_model_publish*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
markers = [
    "archive: requires committed payload trees",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E712"]
