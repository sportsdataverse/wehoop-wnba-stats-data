# Column descriptions for the released WNBA stats datasets (spec D43).
#
# Authored for THIS league against the real stats.wnba.com payloads and the
# committed/published parquets. Never borrowed from another sport's schema
# store -- a borrowed description is an invented one (the WBB pilot's
# borrowed store produced `assists` = "Assisted tackles").
#
# Keyed by column NAME: a column means the same thing in every dataset that
# carries it (`game_id` is always the padded stats.wnba.com game id). A
# column with no entry renders as an empty cell in the generated docs, which
# is an honest TODO. Priority coverage: pbp, schedules, the schedule-master
# artifacts, and the shared identity/join keys.

# --- identity / join keys -----------------------------------------------------
game_id: >-
  stats.wnba.com game id, 10-char string carrying the "10" WNBA league prefix
  ("1022400001"); pinned Utf8 so it never round-trips through int.
season: >-
  Season the row belongs to, as a BARE calendar year ("2023") — the WNBA
  season fits one calendar year, unlike the NBA span form.
season_id: >-
  stats.wnba.com composite season id: season-type digit + year
  ("22023" = 2023 regular season).
season_type: >-
  First underscore-separated field of the raw capture's filename, which for a
  season-type-partitioned endpoint IS the season type: "regular-season" or
  "playoffs" (lower-case and hyphenated, not "Regular Season"). On rosters and
  coaches the captures are partitioned by TEAM, so this column repeats team_id
  and carries no season-type meaning -- a known defect, see those pages.
season_type_id: >-
  Leading digit of season_id encoding the season type (2 = regular season,
  4 = playoffs).
league_id: >-
  stats.wnba.com league id ("10" = WNBA).
team_id: >-
  stats.wnba.com team id (e.g. 1611661313 = New York Liberty).
person_id: >-
  stats.wnba.com person id of the player (or official) the row describes; the
  same id space as player_id.
player_id: >-
  stats.wnba.com person id of the player (Int64); joins rosters, boxscores,
  game logs and pbp (`person_id`).
player_name: >-
  Player display name as the stats API ships it ("Breanna Stewart").
official_id: >-
  stats.wnba.com person id of the game official.
team_abbreviation: >-
  Three-letter team code ("NYL").
team_tricode: >-
  Three-letter team code as the v3 endpoints name it ("NYL").
team_name: >-
  Team nickname or full name as the source endpoint ships it.
team_city: >-
  Team city name.

# --- pbp (playbyplayv3) -------------------------------------------------------
action_number: >-
  Ordinal of the action within the game as numbered by the stats feed;
  monotone but not gapless (video-only actions are skipped).
action_id: >-
  Feed-internal id of the action row.
clock: >-
  Game clock at the action in ISO-8601 duration form ("PT08M12.00S").
period: >-
  Period number (1-4; 5+ = overtime).
player_name_i: >-
  Abbreviated player name ("B. Stewart").
x_legacy: >-
  Shot x-coordinate in the legacy stats coordinate frame (tenths of feet from
  the basket centerline; 0 for non-shot actions).
y_legacy: >-
  Shot y-coordinate in the legacy coordinate frame (tenths of feet from the
  basket toward half court, so 0 at the basket and negative for a shot from
  behind it; 0 for non-shot actions).
shot_distance: >-
  Shot distance in feet (0 for non-shots).
shot_result: >-
  "Made" / "Missed" for shot actions; empty otherwise.
is_field_goal: >-
  1 when the action is a field-goal attempt, else 0.
score_home: >-
  Home score after the action (string; carried forward between scores).
score_away: >-
  Away score after the action (string; carried forward between scores).
points_total: >-
  Points the acting team has scored through this action.
location: >-
  Which side the acting team is on: "h" (home) or "v" (visitor).
description: >-
  Human-readable action narrative from the feed.
action_type: >-
  Action family ("Made Shot", "Rebound", "Turnover", "Foul", ...).
sub_type: >-
  Action detail within the family ("Jump Shot", "Offensive", ...).
shot_value: >-
  Point value of a shot attempt (2 or 3; 1 for free throws, 0 for non-shots).
video_available: >-
  1 when the feed links video for the action/game row.

# --- schedules / game logs (leaguegamelog, mixed grain) -----------------------
game_date: >-
  Game date as the source ships it (calendar date, US Eastern; a Date column
  in the schedule master).
matchup: >-
  Matchup string from the log ("NYL @ LVA" away, "NYL vs. LVA" home).
wl: >-
  Result from the row team's perspective: "W" or "L".
min: >-
  Team (or player) minutes in the log row.
fgm: Field goals made.
fga: Field goals attempted.
fg_pct: Field-goal percentage (0-1).
fg3m: Three-point field goals made.
fg3a: Three-point field goals attempted.
fg3_pct: Three-point percentage (0-1).
ftm: Free throws made.
fta: Free throws attempted.
ft_pct: Free-throw percentage (0-1).
oreb: Offensive rebounds.
dreb: Defensive rebounds.
reb: Total rebounds.
ast: Assists.
stl: Steals.
blk: Blocks.
tov: Turnovers.
pf: Personal fouls.
pts: Points.
plus_minus: >-
  Point differential while on the floor (player rows) or final margin
  (team rows).
fantasy_pts: >-
  WNBA fantasy points for the player log row (null on team rows).
measure_type: >-
  Grain marker of the mixed leaguegamelog capture: "p" marks player game-log
  rows; the per-team rows come from a capture with no measure suffix and so
  carry NULL here, not "t". Filter on player_id.is_not_null() rather than on
  this column if you want player rows only.

# --- schedule master / games_in_data_repo (D34) -------------------------------
in_pbp: >-
  True when the game's play-by-play made it into a compiled season release.
in_game_rosters: >-
  True when the game is present in the compiled game_rosters release.
in_officials: >-
  True when the game is present in the compiled officials release.
in_player_boxscores: >-
  True when the game is present in the compiled player_boxscores release.
in_team_boxscores: >-
  True when the game is present in the compiled team_boxscores release.
home_team_id: stats.wnba.com team id of the home team.
away_team_id: stats.wnba.com team id of the away team.
home_team_name: Home team name.
away_team_name: Away team name.
home_team_abbreviation: Home team three-letter code.
away_team_abbreviation: Away team three-letter code.
home_team_score: Home final (or current) score.
away_team_score: Away final (or current) score.

# --- derived curves (`metric_curves`) and windows (`rolling_windows`) ----------
#
# sdv-py's cross-league contracts: `sportsdataverse.metric_curves` (F4), one row
# per (season, entity, bucket) of FG% by shot distance, and
# `sportsdataverse.rolling_windows` (F3), one row per (season, player, window).
# Ids are TEXT on both -- the four leagues share one table shape, and `id_source`
# names the namespace.
entity_type: >-
  Which aggregate the row is: "league" (every counted attempt that season),
  "team" or "player" on metric_curves; always "player" on rolling_windows.
entity_id: >-
  stats.wnba.com id of the entity as TEXT -- the team_id on a team row, the
  person_id on a player row, null on the league row.
entity_name: >-
  Label for the entity: the team tricode ("NYL") on a team row, the shooter's
  name as the pbp ships it on a player row; null on the league row.
id_source: >-
  Namespace of `entity_id` / `team_id` on this row -- "wnba_stats" here; the
  cross-league contract carries "espn", "gsis" and "nba_stats" elsewhere.
metric: >-
  What the row measures: "fg_pct_by_shot_distance" on metric_curves
  (field-goal percentage by shot distance in feet); "fg_pct" (window_unit
  "fga") or "fg3_pct" (window_unit "fg3a") on rolling_windows.
down: >-
  Null on every row: the second axis of the football-only
  success_by_down_distance curve, carried for the cross-league contract.
x_lo: >-
  Bucket lower edge in feet, inclusive: 1-ft bins from 0 to 35, then 35 and 50.
x_hi: >-
  Bucket upper edge in feet, exclusive: x_lo + 1 below 35 ft, then 50 and 95.
attempts: >-
  Field-goal attempts in the bucket -- regular-season and playoff shots
  (season_type_id 2 and 4, the game id's type digit). An empty bucket is
  absent, never a zero row.
successes: >-
  Made field goals in the bucket.
rate: >-
  successes / attempts, one exact division (no smoothing or prior).
epa_per_att: >-
  Null on every row: shots carry no EPA. Populated on the football twins of
  this contract.
window_unit: >-
  What the window counts: "fga" (every field-goal attempt) or "fg3a"
  (three-point attempts). Regular-season and playoff attempts only (the game
  id's type digit, 2 or 4).
window_n: >-
  Window size in attempts (50 or 200), not games.
cur: >-
  Make rate over the player's last n attempts through the season (the
  current window).
prev: >-
  Make rate over the window_n attempts just before the current window; null
  unless that whole window exists.
season_start: >-
  Make rate over the window_n attempts just before the season began (form
  entering the season); null unless the career before the season holds a full
  window.
career_baseline: >-
  Make rate over every career attempt (since 1997) before the current window,
  earlier games of this season included; null unless that history holds at
  least window_n attempts.
delta_prev: >-
  cur - prev; null when either side is null.
delta_season: >-
  cur - season_start; null when either side is null.
delta_career: >-
  cur - career_baseline; null when either side is null.
delta_prev_rank: >-
  Rank of delta_prev within (window_unit, window_n, metric), 1 = biggest
  riser, ties share the lowest rank; null unless the row is qualified and
  has a prev.
n: >-
  Attempts the current window averages: window_n, or fewer for a career
  shorter than the window.
qualified: >-
  True when n == window_n (a full window, not a short career). Filter on it
  before ranking or comparing players.
last_event_date: >-
  Date of the player's latest counted attempt through the season.
as_of_date: >-
  Date of the latest counted attempt league-wide that season: the date the
  windows are current through.
