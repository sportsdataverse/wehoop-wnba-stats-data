name: Update WNBA Stats Data

# Python-only since 2026-08-02. The scrape lives in wehoop-wnba-stats-raw
# (its daily job commits the raw store before this cron); this job only
# COMPILES + PUBLISHES: it reads the store over raw.githubusercontent.com,
# builds parquet+rds+csv, and uploads to the wnba_stats_* release tags on
# sportsdataverse-data. No stats.wnba.com calls; the processor commits the
# wnba_stats/ tree per season, and the schedule family (master + manifest +
# coverage, spec D34) is committed by the step below. The retired R
# chain (10 wnba_stats_*.R creation scripts + R processor) scraped live from
# CI; the python registry covers all 15 datasets it produced.
# Serialize every workflow in this repo that commits to it. Two runs in flight put
# one of them behind origin and its push is rejected -- and because the git calls
# are swallowed with no rc check, that lands as a GREEN job that published
# nothing. Observed here on 2026-08-19: runs 32204419012 and 32204417571 started
# in the same minute from two repository_dispatch events, and the first hit
# "! [rejected] main -> main (non-fast-forward)" while reporting success.
#
# cancel-in-progress is FALSE on purpose -- these runs also upload release
# assets, and cancelling mid-upload leaves a tag half-updated. Queue instead.
concurrency:
  group: ${{ github.repository }}-commit
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 7 * 5-9 *" # May - September daily
    - cron: "0 7 1-20 10 *" # early October (regular season + playoffs tail)
  workflow_dispatch:
    inputs:
      start_year:
        required: false
        type: string
      end_year:
        required: false
        type: string

permissions:
  contents: write

jobs:
  build_publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SDV_GH_TOKEN }}
      GITHUB_PAT: ${{ secrets.SDV_GH_TOKEN }}
      WEHOOP_WNBA_STATS_RAW_ROOT: https://raw.githubusercontent.com/sportsdataverse/wehoop-wnba-stats-raw/main/wnba_stats/json
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --frozen --dev

      - name: Default season window
        if: ${{ inputs.start_year == '' }}
        # WNBA seasons are calendar years (nba_api WnbaSeasonYear) -- no
        # October rollover. Replaces the retired Rscript/wehoop lookup.
        run: |
          y=$(date -u +%Y)
          echo "START_YEAR=$y" >> "$GITHUB_ENV"
          echo "END_YEAR=$y" >> "$GITHUB_ENV"

      - name: Inputs override
        if: ${{ inputs.start_year != '' }}
        run: |
          echo "START_YEAR=${{ inputs.start_year }}" >> "$GITHUB_ENV"
          echo "END_YEAR=${{ inputs.end_year || inputs.start_year }}" >> "$GITHUB_ENV"

      - name: Build + publish
        run: |
          WEHOOP_WNBA_STATS_PYBIN="$(pwd)/.venv/bin/python" \
            bash scripts/daily_wnba_stats_python_processor.sh -s "$START_YEAR" -e "$END_YEAR"

      # The schedule family (spec D34/D36): the processor's stage-99 steps
      # restamp the built window's season schedule flags (committed with the
      # per-season tree commit) and rebuild the master + games_in_data_repo
      # manifest + coverage index AFTER the last season commit; commit those
      # union artifacts here.
      - name: Commit schedule master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- wnba_stats/schedules/parquet \
                     wnba_stats/wnba_stats_schedule_master.parquet \
                     wnba_stats/wnba_stats_games_in_data_repo.parquet \
                     wnba_stats/wnba_stats_schedule_coverage.parquet
          git diff --cached --quiet || {
            git commit -m "chore(schedule): refresh schedule master + coverage (${START_YEAR}-${END_YEAR})"
            git push
          }
