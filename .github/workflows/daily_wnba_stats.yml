name: Update WNBA Stats Data

# Python-only since 2026-08-02. The scrape lives in wehoop-wnba-stats-raw
# (its daily job commits the raw store before this cron); this job only
# COMPILES + PUBLISHES: it reads the store over raw.githubusercontent.com,
# builds parquet+rds+csv, and uploads to the wnba_stats_* release tags on
# sportsdataverse-data. No stats.wnba.com calls, no commits. The retired R
# chain (10 wnba_stats_*.R creation scripts + R processor) scraped live from
# CI; the python registry covers all 15 datasets it produced.
on:
  schedule:
    - cron: "0 7 * 5-9 *" # May - September daily
    - cron: "0 7 1-20 10 *" # early October (regular season + playoffs tail)
  workflow_dispatch:
    inputs:
      start_year:
        required: false
        type: string
      end_year:
        required: false
        type: string

permissions:
  contents: write

jobs:
  build_publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SDV_GH_TOKEN }}
      GITHUB_PAT: ${{ secrets.SDV_GH_TOKEN }}
      WEHOOP_WNBA_STATS_RAW_ROOT: https://raw.githubusercontent.com/sportsdataverse/wehoop-wnba-stats-raw/main/wnba_stats/json
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --frozen --dev

      - name: Default season window
        if: ${{ inputs.start_year == '' }}
        # WNBA seasons are calendar years (nba_api WnbaSeasonYear) -- no
        # October rollover. Replaces the retired Rscript/wehoop lookup.
        run: |
          y=$(date -u +%Y)
          echo "START_YEAR=$y" >> "$GITHUB_ENV"
          echo "END_YEAR=$y" >> "$GITHUB_ENV"

      - name: Inputs override
        if: ${{ inputs.start_year != '' }}
        run: |
          echo "START_YEAR=${{ inputs.start_year }}" >> "$GITHUB_ENV"
          echo "END_YEAR=${{ inputs.end_year || inputs.start_year }}" >> "$GITHUB_ENV"

      - name: Build + publish
        run: |
          WEHOOP_WNBA_STATS_PYBIN="$(pwd)/.venv/bin/python" \
            bash scripts/daily_wnba_stats_python_processor.sh -s "$START_YEAR" -e "$END_YEAR"
