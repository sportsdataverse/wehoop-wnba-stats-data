name: Update WNBA Stats Draft (Annual)

# The WNBA Draft happens once a year (mid-April). Its parser
# (R/wnba_stats_07_draft.R) is intentionally excluded from the daily flow
# (daily_wnba_stats.yml) so it isn't re-uploaded to the wnba_stats_draft
# release every day. This workflow runs the annual draft processor instead,
# with the same proxy + dependency setup as the daily flow so the
# stats.wnba.com draft endpoint is reached through the rotating proxy pool
# (un-proxied calls to stats.wnba.com time out).

on:
  schedule:
    - cron: "0 8 15 4 *" # mid-April, ~day after the WNBA draft
    - cron: "0 8 16 4 *" # second pass to catch late-entered picks
  workflow_dispatch:
    inputs:
      start_year:
        required: false
        type: string
      end_year:
        required: false
        type: string
      rescrape:
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  update_wnba_stats_draft:
    runs-on: ${{ matrix.config.os }}
    name: Update WNBA Stats Draft ${{ inputs.start_year }}-${{ inputs.end_year }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: "release" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      PROXY_KEY: ${{ secrets.PROXY_KEY }}
      PROXY_PKG: ${{ secrets.PROXY_PKG }}
      PROXY_ENDPOINT: ${{ secrets.PROXY_ENDPOINT }}
      R_KEEP_PKG_SOURCE: yes
      START_YEAR: ${{ inputs.start_year }}
      END_YEAR: ${{ inputs.end_year }}
      RESCRAPE: ${{ inputs.rescrape }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setting up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setting up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          extra-packages: |
            sportsdataverse/wehoop
            sportsdataverse/sportsdataverse-data
            ropensci/piggyback

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Default year inputs if empty
        if: ${{ env.START_YEAR == '' }}
        run: |
          echo "START_YEAR=$(Rscript -e 'cat(wehoop::most_recent_wnba_season())')" >> $GITHUB_ENV
          echo "END_YEAR=$(Rscript -e 'cat(wehoop::most_recent_wnba_season())')" >> $GITHUB_ENV

      - name: Run annual WNBA Stats draft processor
        env:
          GITHUB_PAT: ${{ secrets.SDV_GH_TOKEN }}
        run: |
          bash scripts/annual_wnba_stats_draft_R_processor.sh -s ${{ env.START_YEAR }} -e ${{ env.END_YEAR }} -r ${{ env.RESCRAPE }}
