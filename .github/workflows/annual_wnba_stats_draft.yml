name: Annual WNBA Draft Update

# Python-only since 2026-08-02. The daily crons run May-early-October, so a
# mid-April draft would sit unpublished for two weeks without this job. It
# builds ONLY the draft dataset (from the drafthistory raw capture) and
# uploads it to its release tag on sportsdataverse-data.
on:
  schedule:
    - cron: "0 8 15 4 *" # mid-April, ~day after the WNBA draft
    - cron: "0 8 16 4 *" # second pass to catch late-entered picks
  workflow_dispatch:
    inputs:
      season:
        required: false
        type: string

permissions:
  contents: write

jobs:
  build_publish_draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SDV_GH_TOKEN }}
      GITHUB_PAT: ${{ secrets.SDV_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --frozen --dev

      - name: Season (calendar year; draft belongs to the season it precedes)
        run: |
          echo "SEASON=${{ inputs.season || '' }}" >> "$GITHUB_ENV"
          if [ -z "${{ inputs.season }}" ]; then
            echo "SEASON=$(date -u +%Y)" >> "$GITHUB_ENV"
          fi

      - name: Build + publish draft
        run: |
          uv run python -m wnba_data_build \
            --root "https://raw.githubusercontent.com/sportsdataverse/wehoop-wnba-stats-raw/main/wnba_stats/json" \
            --seasons "$SEASON" \
            --datasets draft \
            --out build_out \
            --publish
